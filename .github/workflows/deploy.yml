name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a run that's already deploying
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        run: npm run build
        env:
          # Master switch for coffee links and ads. Repository variable MONETIZED: set to "false" to remove them all;
          # unset or anything else leaves them on. Read by site.config.js.
          MONETIZED: ${{ vars.MONETIZED }}
          # Rewarded video ads (Google Ad Manager); ignored when MONETIZED is false. Set these as repository variables under
          # Settings -> Secrets and variables -> Actions -> Variables. Without them, the build has no ads.
          VITE_GAM_REWARDED_UNIT: ${{ vars.GAM_REWARDED_UNIT }}
          ADS_TXT: ${{ vars.ADS_TXT }}
          # Anonymous usage counts (GoatCounter), e.g. https://blorbit.goatcounter.com. Repository variable GOATCOUNTER_URL; without it, no analytics.
          VITE_GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
